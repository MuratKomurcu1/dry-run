[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dry-run-agent"
version = "0.8.1"
description = "Dependency-free Python runtime for deterministic and semantic AI evaluation, red-team generation, and v2 agent cassettes"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Murat Komurcu" }]
dependencies = []

[project.scripts]
dry-run-py = "dryrun.cli:main"

[project.entry-points.pytest11]
dryrun = "dryrun.pytest_plugin"

[tool.setuptools]
packages = ["dryrun"]

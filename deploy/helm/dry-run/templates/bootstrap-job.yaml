{{- if .Values.distributed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dry-run.fullname" . }}-bootstrap
  labels:
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: Never
      securityContext: {{ toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["team", "init", "--dir", "/data/team", "--name", {{ .Values.workspace.name | quote }}, "--retention-days", {{ .Values.workspace.retentionDays | quote }}]
          env:
            - name: DRYRUN_POSTGRES_URL
              valueFrom: { secretKeyRef: { name: {{ include "dry-run.secretName" . }}, key: postgresUrl } }
            - { name: DRYRUN_POSTGRES_SCHEMA, value: {{ .Values.distributed.postgresSchema | quote }} }
            - { name: DRYRUN_S3_ENDPOINT, value: {{ required "distributed.s3Endpoint is required" .Values.distributed.s3Endpoint | quote }} }
            - { name: DRYRUN_S3_BUCKET, value: {{ .Values.distributed.s3Bucket | quote }} }
            - { name: DRYRUN_S3_REGION, value: {{ .Values.distributed.s3Region | quote }} }
            - { name: DRYRUN_S3_TLS, value: {{ .Values.distributed.s3Tls | quote }} }
            - { name: DRYRUN_S3_FORCE_PATH_STYLE, value: {{ .Values.distributed.s3ForcePathStyle | quote }} }
            - { name: DRYRUN_S3_CREATE_BUCKET, value: {{ .Values.distributed.s3CreateBucket | quote }} }
            - name: DRYRUN_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ include "dry-run.secretName" . }}, key: s3AccessKey } }
            - name: DRYRUN_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "dry-run.secretName" . }}, key: s3SecretKey } }
            - { name: DRYRUN_NATS_URL, value: {{ required "distributed.natsUrl is required" .Values.distributed.natsUrl | quote }} }
            - { name: DRYRUN_NATS_REPLICAS, value: {{ .Values.distributed.natsReplicas | quote }} }
            - { name: DRYRUN_WORKSPACE_ALIAS, value: {{ .Values.distributed.workspaceAlias | quote }} }
            - name: DRYRUN_STATE_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ include "dry-run.secretName" . }}, key: stateEncryptionKey } }
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          emptyDir: { sizeLimit: {{ .Values.workspace.size }} }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
{{- end }}

{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dry-run.fullname" . }}
  labels: {{- include "dry-run.labels" . | nindent 4 }}
type: Opaque
stringData:
  clickhousePassword: {{ required "secrets.clickhousePassword is required when analytics.clickhouseUrl is set" (ternary .Values.secrets.clickhousePassword "unused" (ne .Values.analytics.clickhouseUrl "")) | quote }}
  oidcClientSecret: {{ .Values.secrets.oidcClientSecret | quote }}
  oidcCookieSecret: {{ required "secrets.oidcCookieSecret is required when oidc.issuer is set" (ternary .Values.secrets.oidcCookieSecret "unused" (ne .Values.oidc.issuer "")) | quote }}
  scimToken: {{ required "secrets.scimToken is required when SCIM is enabled" (ternary .Values.secrets.scimToken "unused" .Values.scim.enabled) | quote }}
  metricsToken: {{ required "secrets.metricsToken is required when metrics are enabled" (ternary .Values.secrets.metricsToken "unused" .Values.metrics.enabled) | quote }}
  postgresUrl: {{ required "secrets.postgresUrl is required when distributed mode is enabled" (ternary .Values.secrets.postgresUrl "unused" .Values.distributed.enabled) | quote }}
  s3AccessKey: {{ required "secrets.s3AccessKey is required when distributed mode is enabled" (ternary .Values.secrets.s3AccessKey "unused" .Values.distributed.enabled) | quote }}
  s3SecretKey: {{ required "secrets.s3SecretKey is required when distributed mode is enabled" (ternary .Values.secrets.s3SecretKey "unused" .Values.distributed.enabled) | quote }}
  stateEncryptionKey: {{ required "secrets.stateEncryptionKey is required when distributed mode is enabled" (ternary .Values.secrets.stateEncryptionKey "unused" .Values.distributed.enabled) | quote }}
{{- end }}

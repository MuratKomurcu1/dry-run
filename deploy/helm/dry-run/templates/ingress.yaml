{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dry-run.fullname" . }}
  labels: {{- include "dry-run.labels" . | nindent 4 }}
  annotations: {{ toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}ingressClassName: {{ . }}{{- end }}
  {{- with .Values.ingress.tls }}tls: {{ toYaml . | nindent 4 }}{{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "dry-run.fullname" $ }}
                port: { name: http }
          {{- end }}
    {{- end }}
{{- end }}

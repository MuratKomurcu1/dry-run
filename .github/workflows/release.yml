name: Verified multi-registry release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    env:
      # Docker repository names are lowercase even when the GitHub login is not.
      IMAGE: ghcr.io/muratkomurcu1/dry-run
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify tag and package versions agree
        run: |
          package_version="$(node -p "require('./package.json').version")"
          python_version="$(python3 -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")"
          test "${RELEASE_TAG#v}" = "$package_version"
          test "$python_version" = "$package_version"
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=high
      - name: Build npm, Python, SBOM, and container artifacts
        run: |
          npm pack
          python3 -m pip wheel --no-deps --wheel-dir dist-python ./python
          npm run sbom
      - name: Build native scan images
        run: |
          docker buildx build --pull --platform linux/amd64 --load -t "$IMAGE:scan-amd64" .
          docker buildx build --pull --platform linux/arm64 --load -t "$IMAGE:scan-arm64" .
      - name: Scan both final runtime architectures
        run: |
          docker volume create dry-run-trivy-cache >/dev/null
          for architecture in amd64 arm64; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v dry-run-trivy-cache:/root/.cache/trivy \
              aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 \
              image --timeout 15m --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE:scan-$architecture"
          done
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish native multi-architecture container
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE }}:latest
      - name: Record image digest
        run: |
          docker buildx imagetools inspect "$IMAGE@$IMAGE_DIGEST" --format '{{json .Manifest}}' \
            | jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
          echo "$IMAGE@$IMAGE_DIGEST" > image-digest.txt
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
      - name: Attest GHCR image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Publish npm package with provenance
        if: env.NPM_TOKEN != ''
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: Publish Python wheel
        if: env.PYPI_API_TOKEN != ''
        run: |
          python3 -m pip install --disable-pip-version-check 'twine==6.2.0'
          python3 -m twine upload --non-interactive dist-python/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ env.PYPI_API_TOKEN }}
      - name: Create release checksums
        run: sha256sum muratkomurcu-dry-run-*.tgz dist-python/*.whl sbom.cdx.json image-digest.txt > SHA256SUMS
      - name: Attach verified release assets
        run: gh release upload "$RELEASE_TAG" muratkomurcu-dry-run-*.tgz dist-python/*.whl sbom.cdx.json image-digest.txt SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ github.token }}

name: "dry-run"
description: "Run deterministic AI agent tests in CI with dry-run. Record once, replay forever."
branding:
  icon: "check-circle"
  color: "green"

inputs:
  paths:
    description: "Whitespace-separated paths to scan for *.agentest.{ts,js,mjs} scenarios"
    required: false
    default: "tests"
  node-version:
    description: "Node.js version to use"
    required: false
    default: "24"
  version:
    description: "dry-run package version (npm tag or semver range)"
    required: false
    default: "0.3.1"
  junit-path:
    description: "Where to write the JUnit XML report (empty = disabled)"
    required: false
    default: ""
  mode:
    description: "Cassette mode: auto | record | replay | passthrough"
    required: false
    default: "replay"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
    - shell: bash
      env:
        DRYRUN_MODE: ${{ inputs.mode }}
        DRYRUN_PATHS: ${{ inputs.paths }}
        DRYRUN_VERSION: ${{ inputs.version }}
        DRYRUN_JUNIT_PATH: ${{ inputs.junit-path }}
      run: |
        set -euo pipefail
        case "$DRYRUN_MODE" in
          auto|record|replay|passthrough) ;;
          *) echo "Invalid mode: $DRYRUN_MODE" >&2; exit 2 ;;
        esac

        read -r -a dryrun_paths <<< "$DRYRUN_PATHS"
        dryrun_args=("${dryrun_paths[@]}")
        if [[ -n "$DRYRUN_JUNIT_PATH" ]]; then
          dryrun_args+=(--junit "$DRYRUN_JUNIT_PATH")
        fi

        npx -y "@muratkomurcu/dry-run@${DRYRUN_VERSION}" run "${dryrun_args[@]}"
